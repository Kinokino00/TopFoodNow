services:
  backend:
    image: ${DOCKER_HUB_USERNAME}/topfoodnow-backend:latest
    container_name: topfoodnow_backend
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - ./.env
    depends_on:
      - redis
    networks:
      - topfoodnow_network
    entrypoint: java -jar /app/app.jar

  frontend:
    image: ${DOCKER_HUB_USERNAME}/topfoodnow-frontend:latest
    build: ./front-end
    container_name: topfoodnow_frontend
    restart: always
    ports:
      - "4000:80"
    volumes:
      - frontend_data:/app/dist
    depends_on:
      - backend
    networks:
      - topfoodnow_network
    environment:
      - VITE_API_BASE_URL=http://57.158.25.6/api/

  redis:
    image: redis:alpine
    container_name: topfoodnow_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always
    networks:
      - topfoodnow_network

nginx:
  image: nginx:alpine
  container_name: topfoodnow_nginx
  restart: always
  ports:
    - "80:80"
  volumes:
    - ../nginx.conf:/etc/nginx/nginx.conf:ro
    - frontend_data:/usr/share/nginx/html
  depends_on:
    - frontend
    - backend
  networks:
    - topfoodnow_network

networks:
  topfoodnow_network:
    driver: bridge

volumes:
  redis_data:
  frontend_data:
