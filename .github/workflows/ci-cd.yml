name: CI/CD Pipeline

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Build with Maven
        run: mvn -f ./back-end/pom.xml clean package

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Create GCS Key File
        run: echo "${{ secrets.GCS_KEY_JSON }}" > back-end/src/main/resources/gcs-key.json

      - name: Build and push backend Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./back-end
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/topfoodnow-backend:latest

      - name: Build and push frontend Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./front-end
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/topfoodnow-frontend:latest
          build-args: |
            VITE_API_BASE_URL=${{ secrets.APP_BACK_END_URL }}

      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.TOPFOODNOW_EC2_HOST }}
          username: ${{ secrets.TOPFOODNOW_EC2_USERNAME }}
          key: ${{ secrets.TOPFOODNOW_EC2_KEY }}
          script: |
            # 1. 進入主目錄
            cd /home/azureuser/

            # 2. 移除舊的專案資料夾
            rm -rf TopFoodNow

            # 3. 使用 PAT 來 clone 整個倉庫
            # 這裡需要你先在 GitHub 建立一個 Personal Access Token 並存入 secrets
            git clone https://x-oauth-basic:${{ secrets.TOKEN }}@github.com/Kinokino00/TopFoodNow.git TopFoodNow

            # 4. 進入專案目錄
            cd TopFoodNow

            # 5. 停止並移除舊的容器
            sudo docker compose down

            # 6. 重新建置並啟動服務
            sudo docker compose up -d --build --force-recreate
