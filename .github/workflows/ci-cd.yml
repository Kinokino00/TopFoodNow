name: CI/CD Pipeline

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 建置後端 JAR 檔案
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Build with Maven
        run: mvn -f ./back-end/pom.xml clean package

      # 登入 Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # 確保在建置映像檔之前，機密檔案已經存在
      - name: Create GCS Key File
        run: echo "${{ secrets.GCS_KEY_JSON }}" > back-end/src/main/resources/gcs-key.json

      # 建置並推送到 Docker Hub
      - name: Build and push backend Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./back-end
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/topfoodnow-backend:latest

      - name: Build and push frontend Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./front-end # 指定前端的 Dockerfile 路徑
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/topfoodnow-frontend:latest

      # 透過 SSH 連線到 EC2 並部署
      - name: SSH and deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.TOPFOODNOW_EC2_HOST }}
          username: ${{ secrets.TOPFOODNOW_EC2_USERNAME }}
          key: ${{ secrets.TOPFOODNOW_EC2_KEY }}
          script: |
            # 建立專案目錄
            mkdir -p /home/ubuntu/topfoodnow-develop
            cd /home/ubuntu/topfoodnow-develop

            # 建立憑證檔案
            echo "${{ secrets.GCS_KEY_JSON }}" | base64 --decode > /home/ubuntu/gcs-key.json

            # 停止並移除舊容器
            sudo docker-compose down

            # 拉取最新映像檔
            sudo docker-compose pull

            # 使用 GitHub Secrets 傳入的環境變數來啟動容器
            sudo DOCKER_HUB_USERNAME=${{ secrets.DOCKER_HUB_USERNAME }} \
                 RDS_USERNAME=${{ secrets.SPRING_DATASOURCE_USERNAME }} \
                 RDS_PASSWORD=${{ secrets.SPRING_DATASOURCE_PASSWORD }} \
                 APP_BASE_URL=${{ secrets.APP_BASE_URL }} \
                 JWT_SECRET=${{ secrets.JWT_SECRET }} \
                 JWT_EXPIRATION=${{ secrets.JWT_EXPIRATION }} \
                 GOOGLE_APPLICATION_CREDENTIALS=/home/ubuntu/gcs-key.json \
                 docker-compose up -d --force-recreate

            echo "Deployment successful!"
