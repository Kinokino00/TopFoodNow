name: CI/CD Pipeline

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 建置後端 JAR 檔案
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Build with Maven
        run: mvn -f ./back-end/pom.xml clean package

      # 登入 Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # 確保在建置映像檔之前，機密檔案已經存在
      - name: Create GCS Key File
        run: echo "${{ secrets.GCS_KEY_JSON }}" > back-end/src/main/resources/gcs-key.json

      # 建置並推送到 Docker Hub
      - name: Build and push backend Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./back-end
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/topfoodnow-backend:latest

      - name: Build and push frontend Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./front-end # 指定前端的 Dockerfile 路徑
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/topfoodnow-frontend:latest

      # 透過 SSH 連線到 Azure VM 並部署
      - name: SSH and deploy to Azure
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.TOPFOODNOW_EC2_HOST }}
          username: ${{ secrets.TOPFOODNOW_EC2_USERNAME }}
          key: ${{ secrets.TOPFOODNOW_EC2_KEY }}
          script: |
            # 1. 在 VM 上複製或更新 GitHub 專案
            if [ -d "/home/azureuser/TopFoodNow" ]; then
              echo "Project directory exists. Pulling latest changes."
              cd /home/azureuser/TopFoodNow
              git pull origin develop
            else
              echo "Project directory does not exist. Cloning repository."
              git clone https://github.com/Kinokino00/TopFoodNow.git /home/azureuser/TopFoodNow
              cd /home/azureuser/TopFoodNow
            fi

            # 2. 寫入 GCS 金鑰檔案
            echo "${{ secrets.GCS_KEY_JSON }}" | sudo tee /home/azureuser/gcs-key.json > /dev/null
            sudo chmod 600 /home/azureuser/gcs-key.json

            # 3. 停止並移除舊的容器
            sudo docker compose down

            # 4. 拉取最新的 Docker 鏡像
            sudo docker compose pull

            # 5. 使用 GitHub Secrets 傳入環境變數並啟動容器
            sudo APP_BASE_URL=${{ secrets.APP_BASE_URL }} \
                DOCKER_HUB_USERNAME=${{ secrets.DOCKER_HUB_USERNAME }} \
                RDS_USERNAME=${{ secrets.SPRING_DATASOURCE_USERNAME }} \
                RDS_PASSWORD=${{ secrets.SPRING_DATASOURCE_PASSWORD }} \
                JWT_SECRET=${{ secrets.JWT_SECRET }} \
                JWT_EXPIRATION=${{ secrets.JWT_EXPIRATION }} \
                GOOGLE_APPLICATION_CREDENTIALS=/home/azureuser/gcs-key.json \
                docker compose up -d --force-recreate

            echo "Deployment successful!"
