name: CI/CD Pipeline

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 建置後端 JAR 檔案
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Build with Maven
        run: mvn -f ./back-end/pom.xml clean package

      # 登入 Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # 確保在建置映像檔之前，機密檔案已經存在
      - name: Create GCS Key File
        run: echo "${{ secrets.GCS_KEY_JSON }}" > back-end/src/main/resources/gcs-key.json

      # 建置並推送到 Docker Hub
      - name: Build and push backend Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./back-end
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/topfoodnow-backend:latest

      - name: Build and push frontend Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./front-end
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/topfoodnow-frontend:latest

      # --- SSH 部署到 Azure VM ---
      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.TOPFOODNOW_EC2_HOST }}
          username: ${{ secrets.TOPFOODNOW_EC2_USERNAME }}
          key: ${{ secrets.TOPFOODNOW_EC2_KEY }}
          script: |
            sudo sh -c '
              # 1. 確保乾淨的工作目錄
              if [ -d "/home/azureuser/TopFoodNow" ]; then
                rm -rf /home/azureuser/TopFoodNow
              fi
              
              # 2. 複製最新的專案
              git clone https://github.com/Kinokino00/TopFoodNow.git /home/azureuser/TopFoodNow
              
              # 3. 進入專案目錄
              cd /home/azureuser/TopFoodNow
              
              # 4. 在 VM 上建立環境變數檔案
              echo "APP_BASE_URL=${{ secrets.APP_BASE_URL }}" > .env
              echo "DOCKER_HUB_USERNAME=${{ secrets.DOCKER_HUB_USERNAME }}" >> .env
              echo "SPRING_DATASOURCE_USERNAME=${{ secrets.SPRING_DATASOURCE_USERNAME }}" >> .env
              echo "SPRING_DATASOURCE_PASSWORD=${{ secrets.SPRING_DATASOURCE_PASSWORD }}" >> .env
              echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
              echo "JWT_EXPIRATION=${{ secrets.JWT_EXPIRATION }}" >> .env
              
              # 5. 複製並設置 GCS 金鑰
              echo "GOOGLE_APPLICATION_CREDENTIALS=./gcs-key.json" >> .env
              echo "${{ secrets.GCS_KEY_JSON }}" > gcs-key.json
              
              # 6. 停止並移除舊的容器
              /usr/bin/docker compose -f docker-compose.yml --env-file ./.env down
              
              # 7. 拉取最新的 Docker 鏡像
              /usr/bin/docker compose -f docker-compose.yml --env-file ./.env pull
              
              # 8. 啟動容器
              /usr/bin/docker compose -f docker-compose.yml --env-file ./.env up -d --force-recreate
            '
